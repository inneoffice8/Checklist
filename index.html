<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#F0F4F7;font-family:-apple-system,'Noto Sans Thai',sans-serif;color:#111;padding-bottom:90px;max-width:480px;margin:0 auto}
.hdr{background:linear-gradient(160deg,#0E7C86,#0a5560);padding:16px 16px 18px;position:sticky;top:0;z-index:99}
.hdr-title{color:#fff;font-size:16px;font-weight:900;margin-bottom:1px}
.hdr-sub{color:rgba(255,255,255,.65);font-size:11px;margin-bottom:10px}
.date-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.nbtn{background:rgba(255,255,255,.2);border:none;border-radius:10px;width:38px;height:38px;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dbox{flex:1;text-align:center}
.dbig{color:#fff;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px}
.today-pill{background:#4CAF50;color:#fff;font-size:9px;font-weight:700;padding:1px 7px;border-radius:99px}
.dsm{color:rgba(255,255,255,.65);font-size:11px;margin-top:1px}
.prog-row{display:flex;align-items:center;gap:8px}
.prog-bg{flex:1;background:rgba(255,255,255,.2);border-radius:99px;height:9px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;transition:width .3s}
.prog-pct{color:#fff;font-weight:900;font-size:15px;min-width:38px;text-align:right}
.prog-sub{color:rgba(255,255,255,.6);font-size:10px;margin-top:3px}
.body{padding:12px 12px 0}
.back-btn{width:100%;background:#fff;border:2px solid #0E7C86;border-radius:11px;padding:9px;color:#0E7C86;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:12px;font-family:inherit}
.slabel{font-size:10px;font-weight:700;letter-spacing:2px;color:#888;margin:12px 0 7px}
.task{background:#fff;border:1.5px solid #E5E5E5;border-radius:13px;padding:12px 14px;margin-bottom:7px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05);-webkit-user-select:none;user-select:none}
.task.done{background:#F4FBF4;border-color:#A5D6A7}
.task.ms{background:#FFF8F8;border-color:#FFCDD2}
.task.ms.done{background:#F4FBF4;border-color:#A5D6A7}
.task.wk{background:#FFFDE7;border-color:#FFE082}
.task.wk.done{background:#F4FBF4;border-color:#A5D6A7}
.task.new{background:#F3E5F5;border-color:#CE93D8}
.task.new.done{background:#F4FBF4;border-color:#A5D6A7}
.chk{width:26px;height:26px;flex-shrink:0;border-radius:50%;border:2px solid #CCC;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:900;transition:all .2s;margin-top:1px}
.chk.on{background:#4CAF50;border-color:#4CAF50}
.ti{flex:1;min-width:0}
.tx{font-size:14px;font-weight:700;color:#111;line-height:1.4;margin-bottom:5px;word-break:break-word}
.tx.done{color:#AAA;text-decoration:line-through;font-weight:400}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px}
.due{font-size:10px;color:#AAA;background:#F5F5F5;padding:2px 8px;border-radius:99px}
.mspill{font-size:10px;background:#FFEBEE;color:#C62828;padding:2px 8px;border-radius:99px;font-weight:700}
.ms-banner{background:#FFF3F3;border:1.5px solid #FFCDD2;border-radius:13px;padding:11px 14px;margin-bottom:12px}
.ms-title{color:#C62828;font-size:11px;font-weight:700;margin-bottom:5px}
.ms-item{color:#333;font-size:12px;margin-bottom:2px}
.win{background:linear-gradient(135deg,#2E7D32,#43A047);border-radius:16px;padding:20px;text-align:center;margin:8px 0 16px}
.divider{border:none;border-top:1.5px solid #E8E8E8;margin:12px 0}
.note-btn{width:100%;background:#fff;border:1.5px dashed #CCC;border-radius:13px;padding:11px 14px;color:#AAA;font-size:13px;cursor:pointer;text-align:left;font-family:inherit;display:flex;align-items:center;gap:8px}
.note-area{width:100%;background:#fff;border:1.5px solid #CCC;border-radius:13px;padding:12px 14px;color:#111;font-size:13px;resize:vertical;min-height:85px;outline:none;font-family:inherit;margin-top:6px}
.foot{text-align:center;color:#CCC;font-size:10px;padding:8px 0 16px}
.phase-bar{display:flex;gap:6px;overflow-x:auto;margin-bottom:2px;padding-bottom:2px}
.phase-bar::-webkit-scrollbar{display:none}
.pbtn{flex-shrink:0;border:2px solid #ddd;border-radius:99px;padding:4px 12px;background:#fff;cursor:pointer;font-size:11px;font-weight:700;color:#888;font-family:inherit}
.pbtn.on{border-color:#0E7C86;background:#0E7C86;color:#fff}
</style>

<script>
const THD=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัส","ศุกร์","เสาร์"];

const shift=(s,n)=>{const d=new Date(s);d.setDate(d.getDate()+n);return fmt(d);};
const TODAY=fmt(new Date());
let cur=TODAY,C={},N={},showNote=false;
try{C=JSON.parse(localStorage.getItem("dc4")||"{}");N=JSON.parse(localStorage.getItem("dn4")||"{}");}catch(e){}
const sv=()=>{try{localStorage.setItem("dc4",JSON.stringify(C));localStorage.setItem("dn4",JSON.stringify(N));}catch(e){}};

// ── DAILY TASKS ──
const DAILY=[
  {id:"d1",t:"09:00",e:"🌅",tx:"ตื่นนอน + Stretch 15 นาที",                          tg:"สุขภาพ",  tc:"#1B5E20",tb:"#E8F5E9"},

  {id:"d3",t:"10:30",e:"📊",tx:"QuickBooks / Xero 60 นาที (Intuit Academy / Xero Central)", tg:"Finance", tc:"#1565C0",tb:"#E3F2FD"},
  {id:"d4",t:"11:30",e:"📱",tx:"Reels & TikTok (ถ่าย/ตัด/โพส)",                      tg:"รายได้",  tc:"#BF360C",tb:"#FBE9E7"},
  {id:"d5",t:"12:00",e:"🛍️",tx:"โพสขายสินค้าออนไลน์ + เช็คออเดอร์",                 tg:"รายได้",  tc:"#BF360C",tb:"#FBE9E7"},
  {id:"d6",t:"13:00",e:"💼",tx:"เตรียมตัวไปทำงาน",                                    tg:"งาน",     tc:"#01579B",tb:"#E3F2FD"},
  {id:"d7",t:"14:00",e:"💼",tx:"ทำงานหลัก (เกาหลี) 14:00–02:00",                     tg:"งาน",     tc:"#01579B",tb:"#E3F2FD"},
  {id:"d8",t:"20:00",e:"💰",tx:"บันทึกรายได้วันนี้ + โอนเงินออม",                    tg:"การเงิน", tc:"#004D40",tb:"#E0F2F1"},

// ── WEEKLY ──
const WK={
  0:[{id:"w1",e:"💸",tx:"สรุปรายได้สัปดาห์ + อัปเดต Income Tracker",           tg:"การเงิน",tc:"#004D40",tb:"#E0F2F1"},
     {id:"w2",e:"🗓️",tx:"วางแผน Content + Hashtag สัปดาห์หน้า",                tg:"Social",  tc:"#880E4F",tb:"#FCE4EC"},
     {id:"w5",e:"📖",tx:"ทบทวน Finance / Bookkeeping บทเรียนสัปดาห์นี้",       tg:"Finance", tc:"#1565C0",tb:"#E3F2FD"}],

     {id:"f2",e:"📊",tx:"เรียน Finance เพิ่ม 2 ชั่วโมง (วันหยุดพิเศษ)",        tg:"Finance", tc:"#1565C0",tb:"#E3F2FD"},
     {id:"f3",e:"🎥",tx:"ถ่ายคลิป + ตัดต่อ Content สต็อกไว้ล่วงหน้า",         tg:"Social",  tc:"#880E4F",tb:"#FCE4EC"},
     {id:"f4",e:"🌿",tx:"พักผ่อน / ออกไปข้างนอก / Recharge",                   tg:"สุขภาพ",  tc:"#1B5E20",tb:"#E8F5E9"}],
  6:[{id:"w3",e:"🎥",tx:"ถ่ายสต็อกคลิปหลายอันไว้ใช้สัปดาห์หน้า",             tg:"Social",  tc:"#880E4F",tb:"#FCE4EC"},

     {id:"w6",e:"💼",tx:"อัปเดต LinkedIn + Fiverr Profile (Finance/Bookkeeping)",tg:"Finance", tc:"#1565C0",tb:"#E3F2FD"}],

const MS=[
  // Phase 1 — เกาหลี (Foundation)
  {f:"2026-06-01",to:"2026-06-07",id:"m1",e:"🛂",tx:"ต่ออายุพาสปอร์ต (เหลือ < 3 ปี)",                         tg:"เอกสาร",  tc:"#0D47A1",tb:"#E3F2FD"},
  {f:"2026-06-01",to:"2026-06-07",id:"m2",e:"📄",tx:"แปลวุฒิ + ประวัติทำงานเป็นอังกฤษ",                       tg:"เอกสาร",  tc:"#0D47A1",tb:"#E3F2FD"},
  {f:"2026-06-01",to:"2026-06-07",id:"m3",e:"🌐",tx:"ลงทะเบียน toea.doe.go.th",                               tg:"ต่างประเทศ",tc:"#1B5E20",tb:"#E8F5E9"},
  {f:"2026-06-01",to:"2026-06-07",id:"m4",e:"📊",tx:"สมัคร Intuit Academy + เริ่ม QuickBooks Online Cert",    tg:"Finance", tc:"#1565C0",tb:"#E3F2FD",new:true},
  {f:"2026-06-01",to:"2026-06-07",id:"m5",e:"🎓",tx:"สมัคร iTalki + Preply + เปิด TikTok",                   tg:"รายได้",  tc:"#BF360C",tb:"#FBE9E7"},
  {f:"2026-06-15",to:"2026-06-21",id:"m6",e:"📚",tx:"สมัคร Xero Central + เริ่ม Xero Advisor Cert (ฟรี)",    tg:"Finance", tc:"#1565C0",tb:"#E3F2FD",new:true},
  {f:"2026-07-01",to:"2026-07-07",id:"m7",e:"🏆",tx:"สอบผ่าน QuickBooks Online Certified ✅",                  tg:"Finance", tc:"#1565C0",tb:"#E3F2FD",new:true},
  {f:"2026-07-15",to:"2026-07-21",id:"m8",e:"🏆",tx:"สอบผ่าน Xero Advisor Certified ✅",                      tg:"Finance", tc:"#1565C0",tb:"#E3F2FD",new:true},
  {f:"2026-08-01",to:"2026-08-07",id:"m9",e:"📊",tx:"เริ่ม CFI Bookkeeping Course (corporatefinanceinstitute.com)", tg:"Finance",tc:"#1565C0",tb:"#E3F2FD",new:true},
  {f:"2026-08-01",to:"2026-08-07",id:"m10",e:"📝",tx:"ลงทะเบียนสอบ IELTS (เป้าสอบ พ.ย. 2026)",               tg:"IELTS",  tc:"#E65100",tb:"#FFF3E0",new:true},
  {f:"2026-09-01",to:"2026-09-07",id:"m11",e:"💼",tx:"สร้าง Portfolio Bookkeeping 3 ชิ้น (จำลอง)",            tg:"Finance", tc:"#1565C0",tb:"#E3F2FD",new:true},
  {f:"2026-09-15",to:"2026-09-21",id:"m12",e:"🌐",tx:"เปิดโปรไฟล์ Fiverr + Upwork (Finance/Bookkeeping)",    tg:"Finance", tc:"#1565C0",tb:"#E3F2FD",new:true},
  {f:"2026-08-01",to:"2026-08-07",id:"m13",e:"📝",tx:"สอบ IELTS — เป้า 6.5+ 🎯",                                tg:"IELTS",  tc:"#E65100",tb:"#FFF3E0",new:true},
  {f:"2026-09-01",to:"2026-09-07",id:"m14",e:"🏦",tx:"ปิดบัญชีเกาหลี โอนเงินกลับไทยทั้งหมด",                tg:"การเงิน", tc:"#004D40",tb:"#E0F2F1"},
  {f:"2026-09-14",to:"2026-09-21",id:"m15",e:"🇹🇭",tx:"กลับไทย! ✈️ 21 กันยายน 2026 🎉",                          tg:"สำคัญ",  tc:"#B71C1C",tb:"#FFEBEE"},
  // Phase 2 — ไทย (Build Income)
  {f:"2027-01-01",to:"2027-01-10",id:"m16",e:"🪙",tx:"ติดตั้งตู้ซักผ้า + ตู้น้ำดื่ม (~200,000 บาท)",        tg:"ลงทุน",  tc:"#4A148C",tb:"#EDE7F6"},
  {f:"2027-01-10",to:"2027-01-20",id:"m17",e:"💼",tx:"รับลูกค้า Bookkeeping ไทยรายแรก (Fiverr/Facebook)",    tg:"Finance", tc:"#1565C0",tb:"#E3F2FD",new:true},
  {f:"2027-02-01",to:"2027-02-14",id:"m18",e:"💰",tx:"เป้า: ลูกค้า 3 ราย = 24,000 บาท/เดือน",               tg:"Finance", tc:"#1565C0",tb:"#E3F2FD",new:true},
  {f:"2027-03-01",to:"2027-03-07",id:"m19",e:"🌍",tx:"เริ่มหาลูกค้าต่างชาติใน Upwork (eCommerce Bookkeeping)",tg:"Finance",tc:"#1565C0",tb:"#E3F2FD",new:true},
  {f:"2027-04-01",to:"2027-04-07",id:"m20",e:"🎓",tx:"เริ่มเรียน Accounting Diploma ออนไลน์ (สำหรับ NOC 12200 แคนาดา)", tg:"Finance",tc:"#1565C0",tb:"#E3F2FD",new:true},
  {f:"2027-06-01",to:"2027-06-07",id:"m21",e:"💰",tx:"เป้า: ลูกค้า 5 ราย = 40,000 บาท/เดือน ✅",            tg:"Finance", tc:"#1565C0",tb:"#E3F2FD",new:true},
  {f:"2027-08-01",to:"2027-08-07",id:"m22",e:"🇨🇦",tx:"ยื่น Express Entry Profile + สมัคร Saskatchewan/Manitoba PNP", tg:"PR",tc:"#B71C1C",tb:"#FFEBEE",new:true},
  {f:"2027-10-01",to:"2027-10-07",id:"m23",e:"📋",tx:"ตรวจประวัติอาชญากรรม (ใบ ป.106) + ตรวจสุขภาพ",        tg:"เอกสาร", tc:"#0D47A1",tb:"#E3F2FD"},
  // Phase 3 — แคนาดา (PR Pathway)
  {f:"2028-01-01",to:"2028-01-10",id:"m24",e:"🛫",tx:"บินแคนาดา ✈️ เริ่มทำงาน Bookkeeper/Accounting Tech",   tg:"สำคัญ",  tc:"#B71C1C",tb:"#FFEBEE"},
  {f:"2028-06-01",to:"2028-06-07",id:"m25",e:"📊",tx:"ครบ 6 เดือน Canadian Work Experience — เช็คคะแนน CRS", tg:"PR",     tc:"#B71C1C",tb:"#FFEBEE",new:true},
  {f:"2028-09-01",to:"2028-09-07",id:"m26",e:"🎓",tx:"เริ่มเรียน CPA PEP (Chartered Professional Accountant)", tg:"Finance",tc:"#1565C0",tb:"#E3F2FD",new:true},
  {f:"2028-12-01",to:"2028-12-07",id:"m27",e:"🇨🇦",tx:"ยื่น Express Entry PR (NOC 12200) 🎉",                tg:"PR",     tc:"#B71C1C",tb:"#FFEBEE",new:true},
];

const getMS=d=>MS.filter(m=>d>=m.f&&d<=m.to);
const getWK=d=>WK[new Date(d).getDay()]||[];
const done=(d,id)=>!!C[d+"_"+id];
const tog=(d,id)=>{C[d+"_"+id]=!C[d+"_"+id];sv();render();};

function card(task,d,cls=""){
  const ok=done(d,task.id);
  const extra=task.new?` <span style="background:#7B1FA2;color:#fff;font-size:9px;padding:1px 5px;border-radius:99px;font-weight:700">ใหม่</span>`:"";
  return`<div class="task${cls?" "+cls:""} ${ok?"done":""}" onclick="tog('${d}','${task.id}')">
    <div class="chk${ok?" on":""}">${ok?"✓":""}</div>
    <div class="ti">
      <div class="tx${ok?" done":""}">${task.e||""} ${task.tx}${extra}</div>
      <div class="meta">
        <span class="tag" style="background:${task.tb};color:${task.tc}">${task.tg}</span>
        ${task.t?`<span class="due">⏰ ${task.t}</span>`:""}
      </div>
    </div>
  </div>`;
}

function render(){
  const d=cur,isToday=d===TODAY;
  const obj=new Date(d);
  const day=THD[obj.getDay()];
  const isWE=obj.getDay()===0||obj.getDay()===5||obj.getDay()===6;
  const yr=obj.getFullYear()+543;

  document.getElementById("d-main").innerHTML=
    `${obj.getDate()} ${THM[obj.getMonth()]} ${yr}${isToday?'<span class="today-pill">วันนี้</span>':""}`;
  document.getElementById("d-sub").textContent=`วัน${day}${isWE?" 🎉 วันหยุด":""}`;

  const isFri=obj.getDay()===5;
  const ms=getMS(d),wk=getWK(d);
  const dailyForCount=isFri?DAILY.filter(t=>t.id!=="d6"&&t.id!=="d7"):DAILY;
  const all=[...dailyForCount,...wk,...ms];
  const tot=all.length,dn=all.filter(t=>done(d,t.id)).length;
  const p=tot?Math.round(dn/tot*100):0;
  const pc=p>=80?"#4CAF50":p>=50?"#FF9800":"#F44336";
  document.getElementById("pfill").style.cssText=`width:${p}%;background:${pc}`;
  document.getElementById("ppct").textContent=p+"%";
  document.getElementById("psub").textContent=`✅ ${dn} / ${tot} งานวันนี้`;

  let h="";
  if(!isToday) h+=`<button class="back-btn" onclick="goToday()">📅 กลับวันนี้</button>`;

  if(ms.length){
    h+=`<div class="ms-banner"><div class="ms-title">🚨 MILESTONE สัปดาห์นี้!</div>`;
    ms.forEach(m=>h+=`<div class="ms-item">${m.e} ${m.tx}${m.new?' ⭐ ใหม่':''}</div>`);
    h+=`</div>`;
  }

  h+=`<div class="slabel">📋 งานประจำวัน</div>`;
  const dailyShow=isFri?DAILY.filter(t=>t.id!=="d6"&&t.id!=="d7"):DAILY;
  dailyShow.forEach(t=>h+=card(t,d));

  if(wk.length){
    h+=`<hr class="divider"><div class="slabel">📅 งานวัน${day}</div>`;
    wk.forEach(t=>h+=card(t,d,"wk"));
  }
  if(ms.length){
    const newMs=ms.filter(m=>m.new);
    const oldMs=ms.filter(m=>!m.new);
    if(newMs.length){
      h+=`<hr class="divider"><div class="slabel" style="color:#7B1FA2">📊 งานใหม่ Finance & IELTS</div>`;
      newMs.forEach(t=>h+=card(t,d,"new"));
    }
    if(oldMs.length){
      h+=`<hr class="divider"><div class="slabel" style="color:#C62828">🚨 MILESTONE</div>`;
      oldMs.forEach(t=>h+=card(t,d,"ms"));
    }
  }

  h+=`<hr class="divider">
  <button class="note-btn" onclick="toggleNote()">📝 ${N[d]?N[d].slice(0,38)+"...":"โน้ตประจำวัน..."}</button>
  ${showNote?`<textarea class="note-area" id="na" placeholder="บันทึกรายได้ บทเรียน ความรู้สึก..." onchange="saveNote(this.value)">${N[d]||""}</textarea>`:""}`;

  if(p===100) h+=`<div class="win"><div style="font-size:36px">🎉</div>
    <div style="color:#fff;font-weight:900;font-size:17px;margin-top:6px">เสร็จหมดทุกงานวันนี้!</div>
    <div style="color:rgba(255,255,255,.8);font-size:12px;margin-top:4px">เก่งมาก! 💪</div></div>`;

  h+=`<div class="foot">กดที่งานเพื่อติ๊ก ✅ กดอีกครั้งเพื่อยกเลิก<br>บันทึกในเครื่องอัตโนมัติ</div>`;
  document.getElementById("app").innerHTML=h;
  if(showNote) setTimeout(()=>{const el=document.getElementById("na");if(el)el.focus();},50);
}
function go(n){cur=shift(cur,n);render();}
function goToday(){cur=TODAY;render();}
function toggleNote(){showNote=!showNote;render();}
function saveNote(v){N[cur]=v;sv();}
render();
</script>
</body>
</html>
