function card(task,d,cls=""){
  const ok=done(d,task.id);
  return`<div class="task${cls?" "+cls:""} ${ok?"done":""}" onclick="tog('${d}','${task.id}')">
    <div class="chk${ok?" on":""}">${ok?"✓":""}</div>
    <div class="ti">
      <div class="tx${ok?" done":""}">${task.e} ${task.tx}</div>
      ${task.detail&&!ok?`<div class="tx-detail">${task.detail}</div>`:""}
      <div class="meta">
        <span class="tag" style="background:${task.tb};color:${task.tc}">${task.tg}</span>
        ${task.t?`<span class="due">⏰ ${task.t}</span>`:""}
      </div>
    </div>
  </div>`;
}

function render(){
  const d=cur,isToday=d===TODAY;
  const obj=new Date(d);
  const dayNum=obj.getDay();
  const day=THD[dayNum];
  const yr=obj.getFullYear()+543;
  const isFri=dayNum===5;
  const ieltsData=IELTS[dayNum];

  document.getElementById("d-main").innerHTML=
    `${obj.getDate()} ${THM[obj.getMonth()]} ${yr}${isToday?'<span class="today-pill">วันนี้</span>':""}`;

  const dayLabels={6:"🎧 Listening",0:"📖 Reading",1:"✍️ Writing Task 1",2:"🗣️ Speaking",3:"📝 Writing Task 2",4:"🔁 ทบทวน",5:"🎉 Mock Test + Bookkeeping"};
  document.getElementById("d-sub").textContent=`วัน${day} — IELTS: ${dayLabels[dayNum]||""}`;

  const ms=getMS(d);
  const morningTasks=isFri?[]:getMorning(ieltsData||[]);
  const allFri=isFri?FRI:[];
  const all=[...morningTasks,...NIGHT,...allFri,...ms];
  const tot=all.length,dn=all.filter(t=>done(d,t.id)).length;
  const p=tot?Math.round(dn/tot*100):0;
  const pc=p>=80?"#4CAF50":p>=50?"#FF9800":"#F44336";
  document.getElementById("pfill").style.cssText=`width:${p}%;background:${pc}`;
  document.getElementById("ppct").textContent=p+"%";
  document.getElementById("psub").textContent=`✅ ${dn} / ${tot} งานวันนี้`;

  let h="";
  if(!isToday) h+=`<button class="back-btn" onclick="goToday()">📅 กลับวันนี้</button>`;

  if(ms.length){
    h+=`<div class="ms-banner"><div class="ms-title">🚨 MILESTONE เดือนนี้!</div>`;
    ms.forEach(m=>h+=`<div class="ms-item">${m.e} ${m.tx}</div>`);
    h+=`</div>`;
  }

  if(isFri){
    h+=`<div class="day-banner" style="background:#FFF3E0;border:1.5px solid #FFB74D;color:#BF360C">🎉 วันหยุดศุกร์<br>10:00 Mock IELTS → 13:00 PSW Research → 14:00 Bookkeeping</div>`;
    h+=`<div class="slabel">⏰ เช้า — Mock IELTS Full Test</div>`;
    FRI.slice(0,6).forEach(t=>h+=card(t,d,"fri"));
    h+=`<hr class="divider"><div class="slabel">🌅 บ่าย — PSW + Bookkeeping</div>`;
    FRI.slice(6,10).forEach(t=>h+=card(t,d,"fri"));
    h+=`<hr class="divider"><div class="slabel">🌙 กลางคืน</div>`;
    FRI.slice(10).forEach(t=>h+=card(t,d,"night"));
  } else {
    h+=`<div class="slabel">⏰ เช้า 10:00</div>`;
    const morning=getMorning(ieltsData||[]);
    morning.slice(0,2).forEach(t=>h+=card(t,d));
    if(ieltsData){
      h+=`<div class="slabel">📚 IELTS — ${dayLabels[dayNum]}</div>`;
      ieltsData.forEach(t=>h+=card(t,d,"ielts"));
    }
    h+=`<hr class="divider"><div class="slabel">☕ พัก + งาน</div>`;
    morning.slice(morning.length-3).forEach(t=>h+=card(t,d));
    h+=`<hr class="divider"><div class="slabel">🌙 หลังเลิกงาน</div>`;
    NIGHT.forEach(t=>h+=card(t,d,"night"));
  }

  if(ms.length){
    h+=`<hr class="divider"><div class="slabel" style="color:#C62828">🚨 MILESTONE</div>`;
    ms.forEach(t=>h+=card(t,d,"ms"));
  }

  h+=`<hr class="divider">
  <button class="note-btn" onclick="toggleNote()">📝 ${N[d]?N[d].slice(0,40)+"...":"โน้ต / คะแนน IELTS / รายได้..."}</button>
  ${showNote?`<textarea class="note-area" id="na" placeholder="บันทึกคะแนน IELTS วันนี้ / สิ่งที่ยังอ่อน / รายได้..." onchange="saveNote(this.value)">${N[d]||""}</textarea>`:""}`;

  if(p===100) h+=`<div class="win"><div style="font-size:36px">🎉</div>
    <div style="color:#fff;font-weight:900;font-size:17px;margin-top:6px">เสร็จหมดทุกงานวันนี้!</div>
    <div style="color:rgba(255,255,255,.8);font-size:12px;margin-top:4px">เก่งมาก! 💪</div></div>`;

  h+=`<div class="foot">กดที่งานเพื่อติ๊ก ✅ • กดอีกครั้งเพื่อยกเลิก • บันทึกอัตโนมัติ</div>`;
  document.getElementById("app").innerHTML=h;
  if(showNote) setTimeout(()=>{const el=document.getElementById("na");if(el)el.focus();},50);
}

function getMorning(ielts){
  return[
    {id:"a1",t:"10:00",e:"⏰",tx:"ตื่นนอน 10 โมง",tg:"เช้า",tc:"#1B5E20",tb:"#E8F5E9",detail:""},
    {id:"a2",t:"10:05",e:"📊",tx:"เช็คราคาทอง (Gold Now) 15 นาที",tg:"การเงิน",tc:"#004D40",tb:"#E0F2F1",detail:""},
    ...ielts,
    {id:"a9",t:"11:45",e:"☕",tx:"พักผ่อน + กินข้าว",tg:"พัก",tc:"#5D4037",tb:"#EFEBE9",detail:""},
    {id:"a10",t:"13:00",e:"💼",tx:"เตรียมตัวไปทำงาน",tg:"งาน",tc:"#01579B",tb:"#E3F2FD",detail:""},
    {id:"a11",t:"14:00",e:"💼",tx:"ทำงานหลัก 14:00–02:00",tg:"งาน",tc:"#01579B",tb:"#E3F2FD",detail:""},
  ];
}

function go(n){cur=shift(cur,n);render();}
function goToday(){cur=TODAY;render();}
function toggleNote(){showNote=!showNote;render();}
function saveNote(v){N[cur]=v;sv();}
render();
</script>
</body>
</html>
